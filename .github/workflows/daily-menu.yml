name: Daily MSU Menu Email

on:
  schedule:
    # Target delivery ~7 AM Eastern. GitHub Actions has unpredictable delays.
    # 8:00 UTC = 4 AM EDT / 3 AM EST.
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  send-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python msu_menu.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
