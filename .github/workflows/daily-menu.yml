name: Daily MSU Menu Email

on:
  schedule:
    # 7 AM Eastern Time. ET is UTC-4 (summer) / UTC-5 (winter).
    # Using 11:00 UTC = 7 AM EDT, 6 AM EST. Adjust if needed.
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  send-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python msu_menu.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
