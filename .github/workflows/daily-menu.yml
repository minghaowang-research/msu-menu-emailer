name: Daily MSU Menu Email

on:
  schedule:
    # Target delivery ~7 AM Eastern. GitHub Actions has unpredictable delays
    # (often 1-3 hours), so we schedule early to compensate.
    # 9:00 UTC = 5 AM EDT / 4 AM EST. With typical delays, arrives 6-8 AM.
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  send-menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - run: python msu_menu.py
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          RECIPIENT_EMAILS: ${{ secrets.RECIPIENT_EMAILS }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
